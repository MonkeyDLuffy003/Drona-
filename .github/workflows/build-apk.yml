name: Build Native Drona AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Drona AI Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x gradlew || true

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/Drona-AI-debug.apk \;
          ls -la build-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drona-AI-debug
          path: build-artifacts/Drona-AI-debug.apk
          retention-days: 30

      - name: Publish Native APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "Drona AI — Personal Voice Chess Coach (v1.0.0 Native Android)"
          body: |
            # ♟️ Drona AI — Personal Voice Chess Coach (Native Android)

            A native Android chess application built with **Kotlin** and **Jetpack Compose**, powered by a high-performance chess rules and Minimax/Stockfish evaluation engine with interactive voice coaching.

            ### 📱 Download APK
            - **[Drona-AI-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Drona-AI-debug.apk)**

            ---
            ### 🚀 Features:
            - **100% Native Jetpack Compose UI**: Clean, responsive Material 3 dark-themed interface focused on the 8×8 chessboard.
            - **Complete Native Chess Engine**: Full legal move validation, checks, checkmates, stalemates, castling, en passant, pawn promotion, and threefold repetition.
            - **Guru Drona Voice Coach**: Native Android Text-to-Speech (`TextToSpeech`) and Speech Recognition (`SpeechRecognizer`) with real-time tactical commentary.
            - **Play vs AI**: Adjustable difficulty levels from Beginner (~600 Elo) to Master (~2200 Elo).
            - **Two Player Mode**: Local pass-and-play on a single Android device.
            - **Tactical Chess Puzzles**: Curated chess tactics with interactive move validation and explanations.
            - **Training Arena**: Interactive lessons on controlling the center, opening principles, king & pawn endgames, and rook infiltration.
            - **Stockfish Evaluation & Game Analysis**: Real-time centipawn evaluation bar, best move suggestions, and tactical threat warnings.
            - **My Progress**: Local rating tracking, victory records, and achievement milestones.

            ---
            ### 📥 Installation Steps:
            1. Download `Drona-AI-debug.apk` directly to your Android device (Android 8.0 to Android 15 supported).
            2. Open the downloaded APK file.
            3. If prompted, enable **"Allow from this source"** for your browser or file manager.
            4. Tap **Install** and launch **Drona AI**!
          draft: false
          prerelease: false
          make_latest: true
          files: build-artifacts/Drona-AI-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
